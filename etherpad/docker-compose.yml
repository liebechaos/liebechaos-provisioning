volumes:
  database:
  database17:
  etherpadvar:
  plugins:

services:
  app:
    image: etherpad/etherpad:3.3.17
    container_name: etherpad-app
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - plugins:/opt/etherpad-lite/src/plugin_packages
      - etherpadvar:/opt/etherpad-lite/var
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=database
      - DB_USER=${POSTGRES_USER}
      - DB_NAME=${POSTGRES_DB}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DISABLE_IP_LOGGING=true
      - TRUST_PROXY=true
      - PORT=9001
      - PAD_OPTIONS_USE_MONOSPACE_FONT=true
      - SOCKETIO_MAX_HTTP_BUFFER_SIZE=5000000
    depends_on:
      - database
    ports:
      - 127.0.0.1:9001:9001

  database:
    image: postgres:17.12-alpine
    container_name: etherpad-db
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - database17:/var/lib/postgresql/data
