version: '3'

volumes:
  db:
  dump:
  uploads:

services:
  app:
    image: rocketchat/rocket.chat:9.0.0
    container_name: rocketchat-app
    depends_on:
      - db
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - uploads:/app/uploads
    environment:
      - MONGO_URL=mongodb://db:27017/rocketchat?replicaSet=rs0
      - ROOT_URL=https://wald.liebechaos.org
      - PORT=3000
      - DEPLOY_METHOD=docker
    ports:
      - 127.0.0.1:3000:3000

  db:
    image: mongo:8.0.38
    container_name: rocketchat-db
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - db:/data/db
      - dump:/dump
    command: mongod --replSet rs0
