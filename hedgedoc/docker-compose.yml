volumes:
  database17:
  uploads:

services:
  app:
    image: quay.io/hedgedoc/hedgedoc:1.12.0
    container_name: hedgedoc-app
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - CMD_DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - CMD_DOMAIN=laub.liebechaos.org
      - CMD_PROTOCOL_USESSL=true
      - CMD_URL_ADDPORT=false
      - CMD_DEFAULT_PERMISSION=limited
      - CMD_ALLOW_EMAIL_REGISTER=false
      - CMD_PORT=4000
    volumes:
      - uploads:/hedgedoc/public/uploads
    depends_on:
      - database
    ports:
      - 127.0.0.1:4000:4000

  database:
    image: postgres:17.12-alpine
    container_name: hedgedoc-db
    env_file:
      - .env
    volumes:
      - database17:/var/lib/postgresql/data
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
